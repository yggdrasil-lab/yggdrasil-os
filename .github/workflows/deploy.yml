name: Deploy Yggdrasil OS Utilities

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, gaia]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Host Utilities to /usr/local/bin
        run: |
          echo "Updating /usr/local/bin host utilities from repository..."
          cp -f maintenance/cleanup_storage.sh /usr/local/bin/gaia-cleanup.sh
          chmod 0755 /usr/local/bin/gaia-cleanup.sh

          cp -f docker/restart_docker.sh /usr/local/bin/gaia-restart-docker.sh
          chmod 0755 /usr/local/bin/gaia-restart-docker.sh

          cp -f swarm/startup_orchestrator.sh /usr/local/bin/gaia-swarm-startup.sh
          chmod 0755 /usr/local/bin/gaia-swarm-startup.sh

          echo "Syncing local vault Forge checkout..."
          if [ -d /opt/atlas/vault/Forge/yggdrasil-os ]; then
            git -C /opt/atlas/vault/Forge/yggdrasil-os fetch origin
            git -C /opt/atlas/vault/Forge/yggdrasil-os checkout main 2>/dev/null || true
            git -C /opt/atlas/vault/Forge/yggdrasil-os pull origin main || true
          fi

          echo "Deployment complete."
